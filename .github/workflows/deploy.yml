name: Deploy a InfinityFree
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./APLICACIONES DISTRIBUIDAS/
          server-dir: /htdocs/
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            Dockerfile
            docker-compose.yml
            sql/**
            *.zip
            cat
            config/conexion.php
